<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>That page wandered off 💗</title>
  <meta name="theme-color" content="#ffe9ef" />
  <style>
    :root { --rose: #e0457b; --rose-deep: #b92f61; --ink: #3d2030; --ink-soft: #71505f; --cream: #fff8f4; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(800px 500px at 15% 0%, #ffe3ec, transparent 65%),
        radial-gradient(700px 500px at 90% 100%, #ffeef4, transparent 60%),
        var(--cream);
      color: var(--ink);
      font-family: "Quicksand", "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 30rem;
      padding: clamp(1.6rem, 6vw, 2.6rem);
      border: 1px solid #ffd9e4;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 34px 80px -48px rgba(185, 47, 97, 0.6);
    }
    .emoji { font-size: 3rem; line-height: 1; }
    h1 { margin: 0.6rem 0 0.5rem; font-family: Georgia, serif; font-size: clamp(1.8rem, 6vw, 2.4rem); }
    p { margin: 0 0 1.3rem; color: var(--ink-soft); line-height: 1.55; }
    .links { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.3rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 16px 32px -16px rgba(224, 69, 123, 0.8);
    }
    a.ghost { background: #fff; color: var(--rose-deep); box-shadow: none; border: 1px solid #ffd9e4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji" aria-hidden="true">💌</div>
    <h1>That page wandered off.</h1>
    <p>No big deal — the real site is one tap away. (The admin page lives at <code>/admin.html</code>.)</p>
    <div class="links">
      <a id="homeLink" href="./">Take me home</a>
      <a id="adminLink" class="ghost" href="./admin.html">Open admin</a>
    </div>
  </div>
  <script>
    (function () {
      // Work out the project base even when the bad URL has extra segments.
      var parts = window.location.pathname.split("/").filter(Boolean);
      var base = "/" + (parts[0] || "") + "/";
      var home = document.getElementById("homeLink");
      var admin = document.getElementById("adminLink");
      home.href = base;
      admin.href = base + "admin.html";
      if (/admin/i.test(window.location.pathname)) {
        admin.style.background = "linear-gradient(135deg, #e0457b, #b92f61)";
        admin.style.color = "#fff";
        admin.style.border = "none";
      }
    })();
  </script>
</body>
</html>
